services:
  apache:
    image: httpd:2.4
    container_name: task-apache
    ports:
      - "8080:80"
    volumes:
      - ./apache/html:/usr/local/apache2/htdocs:ro
      - ./apache/conf/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - tomcat
    restart: unless-stopped

  tomcat:
    build: ./tomcat
    container_name: task-tomcat
    environment:
      PYTHON_API_URL: http://python-api:5000
    depends_on:
      - python-api
    expose:
      - "8080"
    restart: unless-stopped

  python-api:
    build: ./python
    container_name: task-python
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: taskdb
      DB_USER: taskuser
      DB_PASSWORD: taskpass
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: task-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "3306"
    restart: unless-stopped

volumes:
  mysql_data:
